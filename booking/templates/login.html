{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="text-center">Вход</h2>
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <button type="submit" class="btn btn-success w-100">Войти</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'register' %}">Нет аккаунта? Регистрация</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
